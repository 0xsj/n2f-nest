name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  schedule:
    # Weekly, so newly published advisories fail the dependency audit even
    # when nothing in the repository changed.
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.3.11

jobs:
  check:
    name: Build, lint, unit tests, dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: make install
      - run: make check
      - run: make audit
      - run: make fork-check

  durable:
    name: Integration, contracts, recovery and end-to-end
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: make install
      - run: make infra-up
      - run: make test-memory
      - run: make test-durable
      - name: Collect logs
        if: failure()
        run: |
          mkdir -p ci-logs
          docker compose -f compose.yaml logs --no-color > ci-logs/infrastructure.log 2>&1 || true
          cp /tmp/n2f-e2e-backend.log ci-logs/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: durable-logs
          path: ci-logs
          retention-days: 7
      - if: always()
        run: make infra-down

  mutation:
    name: Mutation testing (weekly)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: make install
      - run: make mutation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-report
          path: reports/mutation
          retention-days: 30
